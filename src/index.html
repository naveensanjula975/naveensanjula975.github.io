                'README.md': `# Welcome to Naveen's Terminal Portfolio! 🎯

        // ── Helpers ─────────────────────────────────────────────────────────────
        const c = (cls, txt) => `<span class="${cls}">${txt}</span>`;
        const bold  = txt => c('t-b', txt);
        const green = txt => c('t-green', txt);
        const yellow= txt => c('t-yellow', txt);
        const cyan  = txt => c('t-cyan', txt);
        const blue  = txt => c('t-blue', txt);
        const mag   = txt => c('t-mag', txt);
        const red   = txt => c('t-red', txt);
        const orange= txt => c('t-orange', txt);
        const dim   = txt => c('t-dim', txt);

        const row = (lbl, val) =>
            `  ${dim('│')} ${cyan(lbl.padEnd(9))} ${val}`;

        // ── Commands ────────────────────────────────────────────────────────────
        const commands = {
            help: () =>
`${bold(green('Available commands:'))}

${yellow('Navigation & Files')}
  ${green('help')}          Show this help
  ${green('ls')} ${cyan('[options]')}  List directory  ${dim('(-la for details)')}
  ${green('cat')} ${cyan('<file>')}    Print file contents
  ${green('pwd')}           Working directory

${yellow('System Info')}
  ${green('whoami')}        Current user
  ${green('uname')} ${cyan('[opts]')}  Kernel info      ${dim('(-a for full)')}
  ${green('date')}          Current date/time
  ${green('uptime')}        System uptime
  ${green('ps')}            Process list
  ${green('neofetch')}      System overview (fancy)
  ${green('htop')}          CPU / memory monitor

${yellow('Utilities')}
  ${green('echo')} ${cyan('<text>')}   Print text
  ${green('history')}       Command history
  ${green('fortune')}       Random dev quote
  ${green('cowsay')} ${cyan('<msg>')} ASCII cow
  ${green('clear')}         Clear screen  ${dim('(or Ctrl+L)')}

${yellow('Tips')}
  ${dim('↑↓')} history  ${dim('Tab')} completion  ${dim('Ctrl+L')} clear

${dim('Try:')} ${green('ls')} then ${green('cat about.txt')}`,

            whoami: () => green(bold(currentUser)),

            pwd: () => blue('/home/naveen'),

            ls: (args) => {
                const files = Object.keys(fileSystem[currentPath] || {});
                if (!files.length) return red('ls: empty directory');
                const now = new Date();
                const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                if (args.includes('-la') || args.includes('-al') || args.includes('-l')) {
                    const total = files.reduce((s,f) => s + (fileSystem[currentPath][f]?.length || 512), 0);
                    const rows = files.map(f => {
                        const content = fileSystem[currentPath][f] || '';
                        const size = content.length || 512;
                        const dt = new Date(now - Math.floor(Math.random()*30)*864e5);
                        const dateStr = `${mons[dt.getMonth()]} ${dt.getDate().toString().padStart(2)} ${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
                        const perm = f.endsWith('.md') ? dim('-rw-r--r--') : dim('-rw-r--r--');
                        const fName = f.endsWith('.md') ? c('t-cyan t-b', f)
                                    : f.endsWith('.txt') ? c('t-blue t-b', f)
                                    : green(bold(f));
                        return `${perm} ${dim('1')} ${green(currentUser)} ${green(currentUser)} ${yellow(size.toString().padStart(7))} ${dim(dateStr)} ${fName}`;
                    });
                    return `${dim('total ' + Math.floor(total/512))}\n${rows.join('\n')}`;
                }
                return files.map(f => {
                    if (f.endsWith('.md'))  return c('t-cyan t-b', f);
                    if (f.endsWith('.txt')) return c('t-blue t-b', f);
                    return green(bold(f));
                }).join('  ');
            },

            cat: (args) => {
                if (!args.length) return `${red('cat:')} missing file operand\nTry ${cyan("'cat --help'")} for more information.`;
                const filename = args[0];
                if (args[0] === '--help') return `Usage: ${green('cat')} ${cyan('[FILE]')}\nPrint file contents to standard output.`;
                const raw = fileSystem[currentPath]?.[filename];
                if (raw === undefined) return `${red('cat:')} ${yellow(filename)}: No such file or directory`;
                // Colorize file contents
                let out = raw
                    // section headers (lines ending with :)
                    .replace(/^([A-Z][^:\n]+):$/gm, m => yellow(bold(m)))
                    // tree branches
                    .replace(/(├──|└──|│)/g, m => dim(m))
                    // key: value pairs
                    .replace(/^(\w[\w\s\/()]+):\s+(.+)$/gm, (_, k, v) => `${cyan(k)}: ${v}`)
                    // emoji bullet points — leave as-is (they look good)
                    // URLs
                    .replace(/(https?:\/\/[^\s<>"'\n]+)/g,
                        u => `<a href="${u}" target="_blank" rel="noopener noreferrer" class="terminal-link">${mag(u)}</a>`);
                return out;

            date: () => {

 ${yellow('1337')} pts/0    00:00:01 ${green('portfolio-terminal')}

${yellow('16384')} pts/0    00:00:00 ${dim('ps')}`,

            htop: () => {

  ${cyan('CPU')} ${bars(Math.floor(Math.random()*40+10))}
  ${cyan('Mem')} ${bars(Math.floor(Math.random()*30+20))}  ${dim('512MB / 2048MB')}
  ${cyan('Swp')} ${bars(0)}  ${dim('0MB / 1024MB')}

  ${yellow('PID')}   ${yellow('USER')}     ${yellow('PRI')}  ${yellow('%CPU')} ${yellow('%MEM')} ${yellow('Command')}
  ${dim('1337')}  ${green('naveen')}     20   ${cyan((Math.random()*5).toFixed(1))}  ${cyan('0.8')}  ${green('portfolio-terminal')}
  ${dim('2048')}  ${green('naveen')}     20   ${cyan((Math.random()*2).toFixed(1))}  ${cyan('0.3')}  ${blue('creativity-engine')}
  ${dim('4096')}  ${green('naveen')}     20   ${cyan((Math.random()*3).toFixed(1))}  ${cyan('1.1')}  ${cyan('javascript-runtime')}`;
            },

            history: () => {

                return commandHistory.map((cmd, i) =>

            echo: (args) => args.join(' '),

                ];
                const [q, a] = quotes[Math.floor(Math.random()*quotes.length)];
                return `${yellow(q)}\n  ${dim('— ')}${cyan(a)}`;
            },

            cowsay: (args) => {
                const msg = args.join(' ') || 'Hello from Naveen!';
                const len = msg.length;
                const b   = '─'.repeat(len + 2);
                return `${dim(' ┌' + b + '┐')}
${dim(' │')} ${yellow(msg)} ${dim('│')}
${dim(' └' + b + '┘')}

${dim('         \\  (oo)\\_______')}

            },

                const sep = dim('─'.repeat(currentUser.length + currentHost.length + 1));
                return `
${c('t-orange', '                    .-/+oossssoo+/-.               ')}${u}
${c('t-orange', '                `:+ssssssssssssssss+:`             ')}${sep}
${c('t-orange', '              -+ssssssssssssssssssss+-           ')}${cyan('OS:')} Ubuntu 22.04.3 LTS x86_64
${c('t-orange', '            -+sssssssssssssssssssssss+-         ')}${cyan('Host:')} Interactive Portfolio
${c('t-orange', '          `-/+sssssssssssssssssssssss/-`       ')}${cyan('Kernel:')} 5.15.0-portfolio
${c('t-orange', '         .+sssssssssssssss+++++++++++++.       ')}${cyan('Uptime:')} Always online

${c('t-orange', '       /+sssssssssssssss+.       ./+++.       ')}${cyan('Shell:')} interactive-terminal 1.0
${c('t-orange', '      .+sssssssssssssss+.         ./+.        ')}${cyan('Resolution:')} Responsive
${c('t-orange', '      +sssssssssssssss+.                      ')}${cyan('DE:')} GNOME Portfolio
${c('t-orange', '      +sssssssssssssss+                       ')}${cyan('WM:')} Browser
${c('t-orange', '      +sssssssssssssss/                       ')}${cyan('Terminal:')} JS Terminal 1.0
${c('t-orange', '      .+sssssssssssss/                        ')}${cyan('CPU:')} Creativity Engine
${c('t-orange', "       `/+sssssssssss/.                        ")}${cyan('Memory:')} ∞ Ideas
${c('t-orange', '         ./osssssss/.                          ')}${cyan('Disk:')} Code & Dreams
${c('t-orange', "           `-/oss/-`                            ")}
${c('t-orange', "              `--`                               ")}${cyan('Contact:')} ${mag('linktr.ee/naveensanjula')}

  ${'  '.repeat(0)}${['t-red','t-orange','t-yellow','t-green','t-cyan','t-blue','t-mag'].map(cl => c(cl,'███')).join('')}`;
            }
        };

        // ── Colorize input for live display ────────────────────────────────────
        const knownCmds = new Set(Object.keys(commands).concat(['cls']));

        function colorizeInput(raw) {
            if (!raw) return '';
            const parts = raw.split(' ');
            const cmd = parts[0];
            const isKnown = knownCmds.has(cmd.toLowerCase());
            const cmdSpan = isKnown ? `<span class="sh-cmd">${cmd}</span>`
                                    : `<span class="sh-err">${cmd}</span>`;
            if (parts.length === 1) return cmdSpan;
            const rest = parts.slice(1).map(p => {
                if (p.startsWith('-'))  return `<span class="sh-flag">${p}</span>`;
                if (p.startsWith('"') || p.startsWith("'")) return `<span class="sh-str">${p}</span>`;
                return `<span class="sh-arg">${p}</span>`;
            }).join(' ');
            return cmdSpan + ' ' + rest;
        }

        // ── Tab-completion strip ─────────────────────────────────────────────
        function updateCompletionStrip() {
            // Injected lazily — only once
            if (!document.getElementById('completion-strip')) {
                const strip = document.createElement('div');
                strip.id = 'completion-strip';
                document.getElementById('input-container').parentNode
                    .insertBefore(strip, document.getElementById('input-container'));
            }
            const strip = document.getElementById('completion-strip');
            const input = currentInput.trim();
            const spaceIdx = input.indexOf(' ');
            strip.innerHTML = '';
            if (!input) return;

            let matches = [];
            if (spaceIdx === -1) {
                const partial = input.toLowerCase();
                matches = [...knownCmds].filter(k => k.startsWith(partial) && k !== partial);
            } else {
                const partial = input.slice(spaceIdx + 1).toLowerCase();
                if (partial) {
                    const files = Object.keys(fileSystem[currentPath] || {});
                    matches = files.filter(f => f.toLowerCase().startsWith(partial) && f !== partial);
                }
            }
            matches.slice(0, 6).forEach(m => {
                const chip = document.createElement('span');
                chip.className = 'completion-chip match';
                chip.textContent = m;
                strip.appendChild(chip);
            });
        }

        // ── Execute command ─────────────────────────────────────────────────
        function executeCommand(input) {
            const parts = input.trim().split(/\s+/);
            const cmd   = parts[0].toLowerCase();
            const args  = parts.slice(1);
            if (commands[cmd]) return commands[cmd](args);
            if (cmd === '')     return '';
            return `${red('bash:')} ${yellow(cmd)}: command not found`;
        }

        // ── Output helpers ──────────────────────────────────────────────────
        function appendLine(html) {
            const d = document.createElement('div');
            d.className = 'output-line';
            d.innerHTML  = html;
            terminalOutput.appendChild(d);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
            return d;
        }

        function appendBlank() {
            appendLine('&nbsp;');
        }

        async function appendCommand(rawCmd) {
            const u = `<span class="prompt-user">${currentUser}@${currentHost}</span>`;
            const s = `<span class="prompt-sep">:</span>`;
            const p = `<span class="prompt-path">${currentPath}</span>`;
            const d$ = `<span class="prompt-dollar">$ </span>`;
            appendLine(u + s + p + d$ + colorizeInput(rawCmd));
            return;
        }

        async function appendOutput(html, typewriter = false) {
            if (!html && html !== 0) return;
            const lines = html.split('\n');
            for (const line of lines) {
                if (typewriter) {
                    const el = appendLine('');
                    await typewriteLine(el, line);
                } else {
                    appendLine(line);
                }
            }
        }

        function typewriteLine(el, html, speed = 12) {
            return new Promise(resolve => {
                let i = 0, buf = '';
                function tick() {
                    if (i >= html.length) { el.innerHTML = buf; resolve(); return; }
                    // Consume a full tag or a single char, append to buffer,
                    // then always assign the whole buffer so the DOM stays valid.
                    if (html[i] === '<') {
                        const end = html.indexOf('>', i);
                        if (end !== -1) { buf += html.slice(i, end + 1); i = end + 1; }
                        else            { buf += html[i++]; }
                    } else {
                        buf += html[i++];
                    }
                    el.innerHTML = buf;
                    terminalOutput.scrollTop = terminalOutput.scrollHeight;
                    setTimeout(tick, speed);
                }
                tick();
            });
        }

        // ── Auto-run boot sequence ──────────────────────────────────────────
        const wait = ms => new Promise(r => setTimeout(r, ms));

        async function runAutoCommands() {
            const bootMsg =
`${green(bold('Ubuntu 22.04.3 LTS'))} ${dim('naveensanjula.me tty1')}

${dim('naveensanjula.me login:')} ${green('naveen')}
${dim('Password:')} ${dim('••••••••')}`;
            await appendOutput(bootMsg, true);
            await wait(300);
            appendBlank();

            const seq = [
                { cmd: 'neofetch',     delay: 400 },
                { cmd: 'ls',           delay: 600 },
                { cmd: 'cat about.txt',delay: 800 },
            ];

            for (const { cmd, delay } of seq) {
                await wait(delay);
                await appendCommand(cmd);
                commandHistory.push(cmd);
                const result = executeCommand(cmd);
                await appendOutput(result, cmd.startsWith('cat') || cmd === 'neofetch');
                appendBlank();
            }

            isExecuting = false;
            updatePrompt();
            updateDisplay();
            hiddenInput.focus();
        }

        // ── Input handlers ──────────────────────────────────────────────────
        function handleInput(ch) {
            if (isExecuting) return;
            currentInput += ch;
            updateDisplay();
        }

        function handleBackspace() {
            if (isExecuting) return;
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        async function handleEnter() {
            if (isExecuting) return;
            const raw = currentInput.trim();
            await appendCommand(currentInput);
            currentInput = '';
            updateDisplay();
            if (!raw) { appendBlank(); return; }

            isExecuting = true;
            commandHistory.push(raw);
            historyIndex = commandHistory.length;

            const result = executeCommand(raw);
            await appendOutput(result, raw === 'neofetch' || raw.startsWith('cat') || raw === 'fortune');
            appendBlank();

            isExecuting = false;
            updatePrompt();
            updateDisplay();
            hiddenInput.focus();
        }

        function handleHistory(dir) {
            if (isExecuting) return;
            if (dir === 'up'   && historyIndex > 0)                    historyIndex--;
            if (dir === 'down' && historyIndex < commandHistory.length) historyIndex++;
            currentInput = commandHistory[historyIndex] ?? '';
            updateDisplay();
        }

        function handleTab() {
            if (isExecuting) return;
            const input    = currentInput.trim();
            const spaceIdx = input.indexOf(' ');

            if (spaceIdx === -1) {
                const p = input.toLowerCase();
                const m = [...knownCmds].filter(k => k.startsWith(p));
                if (m.length === 1) { currentInput = m[0]; updateDisplay(); }
                else if (m.length > 1) appendOutput(m.map(k => green(k)).join('  '));
            } else {
                const partial = input.slice(spaceIdx + 1).toLowerCase();
                const files   = Object.keys(fileSystem[currentPath] || {});
                const m       = files.filter(f => f.toLowerCase().startsWith(partial));
                if (m.length === 1) { currentInput = input.slice(0, spaceIdx + 1) + m[0]; updateDisplay(); }
                else if (m.length > 1) appendOutput(m.map(f => blue(f)).join('  '));
            }
        }

        // ── Display update ──────────────────────────────────────────────────
        function updateDisplay() {
            inputText.innerHTML = colorizeInput(currentInput);
            updateCompletionStrip();
        }

        function updatePrompt() {
            prompt.innerHTML =
                `<span class="prompt-user">${currentUser}@${currentHost}</span>` +
                `<span class="prompt-sep">:</span>` +
                `<span class="prompt-path">${currentPath}</span>` +
                `<span class="prompt-dollar">$ </span>`;
        }

        // ── Events ──────────────────────────────────────────────────────────
        document.addEventListener('keydown', e => {
            hiddenInput.focus();
            switch (e.key) {
                case 'Enter':     e.preventDefault(); handleEnter();           break;
                case 'Backspace': e.preventDefault(); handleBackspace();       break;
                case 'ArrowUp':   e.preventDefault(); handleHistory('up');     break;
                case 'ArrowDown': e.preventDefault(); handleHistory('down');   break;
                case 'Tab':       e.preventDefault(); handleTab();             break;
                default:
                    if (e.ctrlKey && e.key === 'l') { e.preventDefault(); commands.clear(); updateDisplay(); }
                    else if (e.ctrlKey && e.key === 'c') { e.preventDefault(); currentInput = ''; isExecuting = false; appendCommand(''); appendBlank(); updateDisplay(); }
                    else if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) { e.preventDefault(); handleInput(e.key); }
            }
        });

        document.addEventListener('click', () => hiddenInput.focus());

        // ── Panel clock ──────────────────────────────────────────────────────
        function updateClock() {
            const n = new Date();
            const days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const mons  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const hh = n.getHours().toString().padStart(2,'0');
            const mm = n.getMinutes().toString().padStart(2,'0');
            document.getElementById('panel-clock').textContent =
                `${days[n.getDay()]} ${mons[n.getMonth()]} ${n.getDate()}  ${hh}:${mm}`;
        }
        updateClock();
        setInterval(updateClock, 10000);

        // ── Boot ─────────────────────────────────────────────────────────────
        isExecuting = true;
        hiddenInput.focus();
        setTimeout(runAutoCommands, 600);
    </script>
</body>
